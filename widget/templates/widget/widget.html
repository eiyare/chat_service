{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ widget.title }}</title>
  <link rel="stylesheet" href="{% static 'widget/widget.css' %}">
  <style>:root { --accent: {{ widget.accent_color }}; --on-accent: {{ widget.text_color }}; }</style>
</head>
<body>
  <div class="w">
    <header class="w-head">
      <span class="w-title">{{ widget.title }}</span>
      <button type="button" class="w-icon" id="new-chat" title="New conversation" aria-label="New conversation">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="w-icon" id="close" title="Close" aria-label="Close chat">
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>
    <main class="w-thread" id="thread" aria-live="polite">
      <div class="w-msg bot"><div class="w-bubble" id="greeting"></div></div>
      <div id="messages"></div>
    </main>
    <form class="w-composer" id="composer" autocomplete="off">
      <textarea id="prompt" rows="1" placeholder="Ask {{ tenant.chatbot_name }}…" aria-label="Your question" maxlength="2000"></textarea>
      <button type="submit" class="w-send" id="send" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
    <p class="w-foot">Answers come from {{ tenant.name }}'s documents and may be incomplete.</p>
  </div>
  {{ config|json_script:"widget-config" }}
  <script src="{% static 'chat/markdown.js' %}"></script>
  <script src="{% static 'widget/widget.js' %}"></script>
</body>
</html>
